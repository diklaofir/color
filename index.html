<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Layered Color Path Optimizer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <section class="control-bar" aria-label="Generation controls">
      <div class="control-group">
        <button id="chooseImageButton" type="button" class="action-button">Choose image</button>
        <input id="imageInput" type="file" accept="image/*" />
      </div>

      <label class="field">
        <span>Palette colors</span>
        <input id="paletteCount" type="number" min="2" max="32" step="1" value="4" />
      </label>

      <label class="field">
        <span>Lines / color</span>
        <input id="linesPerColor" type="number" min="1" step="1" value="1000" />
      </label>

      <label class="field">
        <span>Nails</span>
        <input id="nailCount" type="number" min="8" step="1" value="256" />
      </label>

      <label class="field field-slider">
        <span>Minimum distance</span>
        <input id="minDistance" type="range" min="1" max="128" step="1" value="26" />
        <strong id="minDistanceValue">26 nails</strong>
      </label>

      <label class="field field-slider">
        <span>Cells / thickness</span>
        <input id="cellsPerThickness" type="range" min="1" max="8" step="1" value="1" />
        <strong id="cellsPerThicknessValue">1x</strong>
      </label>

      <label class="field field-slider">
        <span>Thread thickness</span>
        <input id="threadThickness" type="range" min="0.1" max="0.3" step="0.01" value="0.3" />
        <strong id="threadThicknessValue">0.30% of radius</strong>
      </label>

      <div class="field field-static">
        <span>Working grid</span>
        <strong id="workingGridValue">-</strong>
      </div>

      <div class="action-row">
        <button id="buildButton" type="button" class="action-button">Build stage 1</button>
        <button id="refineLoopButton" type="button" class="action-button">Refine stage 2 loop</button>
        <button id="stopButton" type="button" class="action-button">Stop</button>
        <button id="resetButton" type="button" class="action-button">Reset</button>
        <button id="exportButton" type="button" class="action-button">Export paths</button>
      </div>

      <div class="status-strip" aria-live="polite">
        <div id="phaseLabel" class="status-item">Idle</div>
        <div id="matchLabel" class="status-item">Match 0.00%</div>
        <div id="detailLabel" class="status-detail">Drop an image or choose a file to start.</div>
      </div>
    </section>

    <section id="dropZone" class="workspace" aria-label="Image workspace">
      <div id="dropCopy" class="drop-copy">
        <strong>Drop an image here</strong>
        <span>The optimizer will downscale it, quantize it into a palette, and search layered color paths.</span>
      </div>

      <div id="viewer" class="viewer hidden">
        <div class="panel">
          <div class="panel-label">Target</div>
          <canvas id="targetCanvas"></canvas>
        </div>
        <div class="panel">
          <div class="panel-label">Current</div>
          <canvas id="currentCanvas"></canvas>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
